<div class="lightbox" id="lightbox">

<script>
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbVideo = document.getElementById('lb-video');
  var lbCap = document.getElementById('lb-cap');
  document.querySelectorAll('.gitem').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var href = a.getAttribute('href');
      if (href.slice(-4) === '.mp4') {
        lbImg.style.display = 'none';
        lbImg.src = '';
        lbVideo.style.display = 'inline-block';
        lbVideo.src = href;
        lbVideo.play();
      } else {
        lbVideo.style.display = 'none';
        lbVideo.pause();
        lbVideo.removeAttribute('src');
        lbVideo.load();
        lbImg.style.display = 'inline-block';
        lbImg.src = href;
      }
      var cap = a.parentElement.querySelector('figcaption');
      lbCap.textContent = cap ? cap.textContent : '';
      lb.classList.add('open');
    });
  });
  lbVideo.addEventListener('click', function(e){ e.stopPropagation(); });
  var gt = document.getElementById('gtoggle');
  var gb = document.getElementById('gbody');
  var gm = document.getElementById('gmark');
  gt.addEventListener('click', function(e){
    e.preventDefault();
    var open = gb.classList.toggle('open');
    gm.textContent = open ? '[-]' : '[+]';
  });
  function closeLb(){
    lb.classList.remove('open');
    lbImg.src='';
    lbVideo.pause();
    lbVideo.removeAttribute('src');
    lbVideo.load();
  }
  lb.addEventListener('click', closeLb);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeLb(); } });
</script>
